# Red School 1906 (Update 12.10.2026)

**The V. N. von Derviz Girls' Progymnasium in Pronsk**

The girls' progymnasium was originally established in 1904 by Pavel Pavlovich von Derviz (known as Lugovoy from 1917) in an ordinary wooden house. The Pronsk Town Council allocated the land for the school, while its construction and subsequent maintenance were funded by the nobleman himself. The school accommodated up to 60 girls in four grades. The progymnasium was named after his mother, Vera Nikolaevna (not to be confused with his sister, Varvara Pavlovna, after whom a girls' gymnasium in Moscow was also named).

In December 1905, the school burned down. Fortunately, no one was injured, but the building was almost completely destroyed. Construction then began on a new three-storey brick progymnasium. Even at the time, the new building would become the most remarkable structure in the entire town (apart, perhaps, from its countless churches).

By 1907*, the new building was already providing education across seven grades, with 170 female students enrolled. Teachers also lived on the school premises. In addition, von Derviz funded the **Society for the Assistance of Underprivileged Female Students**, an organization that could cover tuition fees, school supplies, medical care, accommodation, and even further education for graduates.

Over the following decades, the Red School would undergo numerous transformations: the addition of two substantial wings and a theatre, its Soviet-era conversion into a secondary school, its use as a military hospital, a fire, another major reconstruction and restoration (expanding it to four storeys), and finally, around the turn of the millennium, its closure and senseless demolition. Only a fragment of the original fence survives.

More details about the school's history, additional historical materials, and all the mod's source files can be found at https://yellastro2.github.io/Red-School-Pronsk/index.html (if your browser supports automatic translation) and in the accompanying repository.

