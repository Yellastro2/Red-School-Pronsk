$ITEM_DESC "Красная школа 1906 (Обновление 12.10.2026)

Пронская женская, имени В.Н. фон Дервиз, Прогимназия.

Первоначально Павел Павлович фон Дервиз (с 1917г. Луговой) открыл женскую прогимназию в 1904ом году в обычном деревянном доме, землю под школу выделила Пронская дума, но строительство и дальнейшее обеспечение осуществлялось на средства дворянина. Школа обучала до 60 учениц на 4 класса. Названа прогимназия именем его матери Веры Николаевны (не путать с его сестрой Варварой Павловной, именем которой названа так же женская гимназия в г. Москва)

В декабре 1905ого года школа сгорает, никто не пострадал, но здание практически уничтожено, и начинается строительство новой, кирпичной трехэтажной прогимназии. Постройка уже на тот момент станет самой выдающейся во всем городе (кроме может бесчисленных церквей).

К 1907му* году новое здание начинает обучение уже семи классов и 170и гимназисток. В помещениях школы также проживают учителя, а на средства фон Дервиза кроме прочего сформировано «Общество Вспомоществованiя Недостаточнымъ Ученицамъ» - организация могла оплачивать ученицам обучение в школе, снаряжение, медицинскую помощь, жилье и даже финансировала дальнейшее образование выпускниц.

В следующие годы Красную школу ждет пристройка двух внушительных корпусов с Театром, затем советский передел в среднюю школу, в военный госпиталь, пожар, еще одна масштабная перестройка с реставрацией (до 4ех этажей), а затем на рубеже веков, закрытие и бессмысленный снос. Останется только фрагмент забора.

Подробности истории Школы, дополнительные материалы а также все исходники мода можете найти на https://yellastro2.github.io/Red-School-Pronsk/index.html и в приложенном репозитории

